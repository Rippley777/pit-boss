[package]
name = "pit-boss"
version = "0.1.0"
description = "Run the house. A local developer command center."
authors = ["Pit Boss"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "pit_boss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
url = "2"
tauri-plugin-dialog = { version = "^2.6.0", optional = true }

[dev-dependencies]
tempfile = "3"
